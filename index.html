        "button": "Reset"
      },
      {
        "situation": "Something feels wrong or unsafe",
        "fix": "Move to where people are, leave if you need to, and tell a trusted adult today.",
        "route": "redflags",
        "button": "Safety"
      },
      {
        "situation": "I want a recommendation letter",
        "fix": "Ask in your last 1–2 weeks and offer a short summary of what you did.",
        "route": "templates",
        "button": "Template D"
      }
    ],
    "logPromptsIntro": "Your school's internship log is where your hours and reflections go. If you are not sure what to write, use these prompts to fill it in.",
    "logPrompts": [
      {
        "id": "new-skill",
        "prompt": "What new skill did I try today?",
        "starter": "Today I tried ___ for the first time. I used it to ___.",
        "why_it_helps": "Builds a list of skills for your resume and college applications."
      },
      {
        "id": "challenge",
        "prompt": "What was the most challenging thing today, and how did I handle it?",
        "starter": "The hardest part was ___. I handled it by ___. Next time I will ___.",
        "why_it_helps": "Shows problem-solving and resilience, which interviewers and teachers like to hear about."
      },
      {
        "id": "industry",
        "prompt": "What is one thing I learned about this industry or workplace?",
        "starter": "I learned that people in this field ___. I was surprised by ___.",
        "why_it_helps": "Helps you decide whether this career is right for you, and gives you something real to write in essays."
      },
      {
        "id": "people",
        "prompt": "Who helped me or taught me something today, and what did I learn from them?",
        "starter": "___ showed me how to ___. The best advice I got today was ___.",
        "why_it_helps": "Reminds you who to thank and who to ask for a reference letter."
      },
      {
        "id": "next-goal",
        "prompt": "What is one thing I want to do better or try next time?",
        "starter": "Next time I will ___ so that I can ___.",
        "why_it_helps": "Turns each day into progress and gives you ideas for your end-of-internship summary."
      }
    ]
  }
};

</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --indigo:#263593; --indigo-deep:#111a54; --orange:#f6b044; --green:#62c493; --sky:#75b9e5; --blue:#5fa3e3;
  --radius:22px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--indigo);color:#fff;font-size:16px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{text-transform:uppercase;font-weight:800;line-height:1.1;letter-spacing:.01em}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:8px}

.top{position:relative;z-index:5;padding:18px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.logo img{height:58px;width:auto}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{text-decoration:none;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em;padding:8px 14px;border-radius:999px;transition:background .2s,color .2s}
.nav a:hover,.nav a[aria-current="page"]{background:var(--orange);color:var(--indigo)}
main{flex:1;position:relative}
#app{position:relative;z-index:1;padding-bottom:56px}
.page-in{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.btn{display:inline-block;background:#fff;color:var(--indigo);font-weight:700;text-transform:uppercase;text-decoration:underline;font-size:15px;letter-spacing:.04em;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;text-align:center;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.btn:hover{background:var(--indigo);color:#fff;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.btn.sm{padding:8px 16px;font-size:13px;text-decoration:none}
.btn.orange{background:var(--orange);text-decoration:none}
.btn.orange:hover{background:var(--indigo);color:#fff}
.btn.ghost{background:transparent;color:#fff;border:2px solid #fff;text-decoration:none}
.btn.ghost:hover{background:#fff;color:var(--indigo)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding-top:12px}
.welcome{position:relative;background:var(--orange);border-radius:var(--radius);padding:clamp(28px,5vw,56px) clamp(24px,4vw,48px);color:#fff}
.welcome::before,.welcome::after{content:"";position:absolute;border-radius:50%;background:var(--orange)}
.welcome::before{width:70px;height:70px;left:34px;bottom:-34px}
.welcome::after{width:30px;height:30px;left:16px;bottom:-64px}
.welcome .wl{font-weight:600;font-size:clamp(17px,2.4vw,24px);margin-bottom:6px}
.welcome h1{font-size:clamp(40px,7vw,76px);text-shadow:0 3px 0 rgba(38,53,147,.28)}
.welcome .sub{margin-top:14px;font-weight:600;color:var(--indigo);max-width:34ch}
.visual{width:100%;max-width:470px;margin:0 auto;transition:transform .5s}
.visual:hover{transform:rotate(-2deg) scale(1.03)}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:44px;justify-content:center}
.pills a{background:#fff;color:var(--indigo);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:10px 20px;border-radius:999px;text-decoration:none;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.pills a:hover{background:var(--orange);transform:translateY(-3px);box-shadow:0 8px 16px rgba(0,0,0,.2)}

.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:40px}
.tile{flex:1 1 280px;max-width:352px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;text-decoration:none;border-radius:var(--radius);padding:26px 24px 24px;text-align:center;min-height:210px;transition:transform .25s,box-shadow .25s}
.tile small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--indigo)}
.tile h2{font-size:clamp(24px,3vw,30px);color:#fff;text-shadow:0 2px 0 rgba(38,53,147,.35);margin-top:4px}
.tile.sky{background:var(--sky)} .tile.green{background:var(--green)} .tile.orange{background:var(--orange)}
.tile:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 18px 34px rgba(0,0,0,.28)}
.tile:hover .btn{background:var(--indigo);color:#fff}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
.stat{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:var(--radius);padding:20px 12px;text-align:center}
.stat b{display:block;font-size:clamp(34px,6vw,54px);font-weight:800;color:var(--orange);line-height:1}
.stat span{display:block;margin-top:6px;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.06em}

.sec-title{font-size:clamp(26px,4vw,38px);color:var(--orange);margin:56px 0 20px}
.calm{background:#fff;color:var(--indigo);border-radius:var(--radius);padding:26px 28px;border-left:12px solid var(--green);display:grid;gap:12px}
.calm h2{font-size:26px}
.calm p{font-weight:500}
.calm ol{padding-left:22px;display:grid;gap:6px;font-weight:500}

/* generic page bits */
.page-title{font-size:clamp(34px,6.5vw,60px);color:var(--orange);margin:12px 0 6px;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:8px}
.lead{max-width:680px;font-weight:500;margin:14px 0 26px}
.back{display:inline-block;font-weight:700;text-transform:uppercase;font-size:14px;text-decoration:none;margin:6px 0 14px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);transition:background .2s,color .2s}
.back:hover{background:var(--orange);color:var(--indigo)}
.box{border-radius:var(--radius);padding:24px 26px;color:var(--indigo);transition:transform .25s,box-shadow .25s}
.box:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.25)}
.box.green{background:var(--green)} .box.sky{background:var(--sky)} .box.orange{background:var(--orange)} .box.white{background:#fff}
.mark{display:inline-block;background:var(--indigo);color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;border-radius:999px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.chip:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--indigo)}
.chips.dark .chip{border-color:var(--indigo);color:var(--indigo)}
.chips.dark .chip[aria-pressed="true"]{background:var(--indigo);color:#fff}

/* roadmap */
.phases{display:grid;gap:26px}
.phase{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:start}
.badge{width:88px;height:88px;display:grid;place-items:center;color:var(--indigo);font-weight:800;font-size:38px;transition:transform .25s}
.phase:hover .badge{transform:scale(1.1) rotate(-4deg)}
.badge.leaf{background:var(--green);border-radius:0 100% 0 100%}
.badge.square{background:var(--sky);border-radius:8px}
.badge.circle{background:var(--orange);border-radius:50%}
.phase h2{font-size:clamp(22px,3vw,30px)}
.phase .tag{font-weight:600;margin:6px 0 14px}
.steps{display:grid;gap:12px;list-style:none;padding:0}
.steps li{background:rgba(255,255,255,.55);border-radius:16px;padding:12px 16px;font-size:15px;font-weight:500}
.steps li b{display:block;font-weight:700;font-size:16px;margin-bottom:2px}

/* safety */
.sheet{display:grid;gap:12px}
.sheet .intro{font-weight:600;font-size:18px;margin-bottom:6px}
details{background:#fff;color:var(--indigo);border-radius:16px;overflow:hidden}
summary{cursor:pointer;font-weight:700;padding:16px 20px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";flex:none;width:28px;height:28px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:800;transition:transform .2s}
details[open] summary::after{content:"–"}
details .ans{padding:0 20px 18px;font-weight:500;font-size:15px}
details ul{margin:10px 0 0;padding-left:20px;display:grid;gap:4px}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.contact{background:var(--sky);color:var(--indigo);border-radius:var(--radius);padding:18px 20px}
.contact:nth-child(even){background:var(--green)}
.contact:last-child{background:var(--orange)}
.contact b{display:block;font-size:17px;text-transform:uppercase;font-weight:800;line-height:1.2;margin-bottom:6px}
.contact span{font-size:14px;font-weight:500}

/* templates */
.tpl{display:grid;gap:22px}
.tpl-card{background:#fff;color:var(--indigo);border-radius:var(--radius);padding:24px 26px;border-top:10px solid var(--orange);display:grid;gap:14px}
.tpl-head{display:flex;gap:16px;align-items:center}
.tpl-head .badge{width:64px;height:64px;font-size:28px;flex:none}
.tpl-head h2{font-size:clamp(19px,2.6vw,24px)}
.tpl-head p{font-size:14px;font-weight:500;margin-top:4px}
.sub-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#4a57b3}
.msg{background:#eef0fb;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.msg mark{background:var(--orange);color:var(--indigo);font-weight:700;border-radius:6px;padding:0 4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.tips{padding-left:20px;font-size:14px;font-weight:500;display:grid;gap:3px}
.dlbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.hint{font-size:13px;font-weight:500;opacity:.9}

/* scenarios */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px;align-items:start}
.sc{background:#fff;color:var(--indigo);border-radius:var(--radius);overflow:hidden;border-top:10px solid var(--green);transition:transform .25s,box-shadow .25s}
.sc:nth-child(2){border-top-color:var(--sky)} .sc:nth-child(3){border-top-color:var(--orange)}
.sc:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(0,0,0,.3)}
.sc .front{padding:22px 24px;display:grid;gap:12px}
.sc h2{font-size:clamp(20px,2.4vw,24px)}
.sc .sit{font-weight:500;font-size:15px}
.sc .back-side{display:grid;gap:12px;padding:0 24px 24px}
.sc .back-side[hidden]{display:none}
.ans-box{border-radius:16px;padding:14px 16px;font-size:15px;font-weight:500}
.ans-box b{display:block;text-transform:uppercase;font-size:12px;letter-spacing:.07em;margin-bottom:4px;font-weight:800}
.ans-box.a{background:var(--green)} .ans-box.s{background:#eef0fb} .ans-box.w{background:var(--sky)}

/* reflect */
.rgrid{display:grid;gap:18px}
.rcard{display:grid;grid-template-columns:70px 1fr;gap:18px;align-items:start;background:#fff;color:var(--indigo);border-radius:var(--radius);padding:20px 24px;transition:transform .25s,box-shadow .25s}
.rcard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.25)}
.rcard .badge{width:60px;height:60px;font-size:26px}
.rcard h2{font-size:clamp(18px,2.4vw,23px);margin-bottom:8px}
.rcard .st{background:#eef0fb;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px}
.rcard .why{font-size:14px;font-weight:500;margin-top:8px}

/* recap */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.rule{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;background:#fff;color:var(--indigo);border-radius:var(--radius);padding:16px 18px;transition:transform .25s,box-shadow .25s}
.rule:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.25)}
.rule .badge{width:52px;height:52px;font-size:22px}
.rule h3{font-size:17px;margin-bottom:4px}
.rule p{font-size:14px;font-weight:500}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;align-items:start}
.checks h3{font-size:19px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.checks .count{background:var(--indigo);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;height:max-content;white-space:nowrap}
.chk-row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;margin-top:8px;background:rgba(255,255,255,.55);border-radius:12px;font-weight:600;font-size:15px;cursor:pointer}
.chk-row input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--indigo);cursor:pointer}
.chk-row:has(input:checked) span{text-decoration:line-through;opacity:.65}
.fixes{display:grid;gap:12px}
.fix{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;color:var(--indigo);border-radius:18px;padding:14px 18px}
.fix b{display:block;text-transform:uppercase;font-size:15px;font-weight:800}
.fix span{font-size:14px;font-weight:500;display:block;margin-top:2px}
.fix .btn{flex:none}
@media (max-width:600px){.fix{flex-direction:column;align-items:flex-start}}

/* copy toast-ish */
footer{background:var(--blue);color:var(--indigo-deep);padding:20px 0;margin-top:auto}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap}
footer p{font-weight:600;font-size:14px;max-width:680px}
footer a{font-weight:800;text-transform:uppercase;font-size:18px;text-decoration:underline;padding:6px 4px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .visual{max-width:340px;order:-1}
  .welcome::before,.welcome::after{display:none}
}
@media (max-width:600px){
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .phase{grid-template-columns:1fr}
  .badge{width:64px;height:64px;font-size:28px}
  .rcard{grid-template-columns:1fr}
  .logo img{height:48px}
  .nav a{font-size:12px;padding:7px 11px}
  .box{padding:20px 18px}
  .tpl-card{padding:20px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl = s => esc(s).replace(/\[[^\]]+\]/g, m => `<mark>${m}</mark>`);
const shapes = ['leaf', 'square', 'circle', 'leaf'];
const boxColors = ['green', 'sky', 'orange', 'green'];
const R = CONTENT;

/* registry of texts for Copy / Download buttons */
const TXT = {}; let tid = 0;
const reg = t => { const k = 't' + (++tid); TXT[k] = t; return k; };
const fullMsg = v => `Subject: ${v.subject}\n\n${v.body}`;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function allTemplatesText() {
  return 'SURVIVAL HUB — EMAIL & MESSAGE TEMPLATES\nReplace everything in [square brackets] before you send.\n\n' +
    R.templates.map(t => `=====  TEMPLATE ${t.letter}: ${t.title.toUpperCase()}  =====\nWhen to use: ${t.when}\n\n` +
      t.variants.map(v => `--- ${v.label} ---\n${fullMsg(v)}`).join('\n\n')).join('\n\n\n');
}
function recapText() {
  const r = R.recap;
  return 'SURVIVAL HUB — QUICK RECAP\n\nGOLDEN RULES\n' + r.goldenRules.map((g, i) => `${i + 1}. ${g.title}: ${g.text}`).join('\n') +
    '\n\nCHECKLIST\n' + r.phaseChecks.map(p => `${p.phase}\n` + p.items.map(x => `  [ ] ${x}`).join('\n')).join('\n\n') +
    '\n\nQUICK FIXES\n' + r.quickFixes.map(q => `- ${q.situation}: ${q.fix}`).join('\n') + '\n';
}

/* ---------- pages ---------- */
function pageHome() {
  const tiles = [
    ['roadmap', 'Step by step', 'First Job Roadmap', 'sky'],
    ['safety', 'Rights & basics', 'Safety & Workplace Basics', 'green'],
    ['templates', 'Copy & download', 'Email & Message Templates', 'orange'],
    ['scenarios', 'Flashcards', 'Real-World Scenarios', 'sky'],
    ['recap', 'Cheat sheet', 'Quick Recap', 'green']
  ];
  const c = R.calmReset;
  return `<div class="page-in">
  <section class="hero">
    <div class="welcome"><p class="wl">your first internship toolkit</p><h1>SURVIVAL HUB!</h1><p class="sub">Practical tips for your first workplace. You've got this.</p></div>
    <img class="visual" src="${VISUAL}" alt="A green office building with leafy balconies, and a student presenting a slide titled Things I Learned">
  </section>
  <nav class="pills" aria-label="Quick topics"><a href="#logistics">Logistics</a><a href="#etiquette">Etiquette</a><a href="#stress">Stress relief</a></nav>
  <section class="tiles" aria-label="Sections">
    ${tiles.map(([k, s, t, col]) => `<a class="tile ${col}" href="#${k}"><div><small>${s}</small><h2>${t}</h2></div><span class="btn">LEARN MORE</span></a>`).join('')}
  </section>
  <section class="stats" aria-label="What's inside">
    <div class="stat"><b>${R.roadmap.length}</b><span>Roadmap phases</span></div>
    <div class="stat"><b>${R.safety.length}</b><span>Fact sheets</span></div>
    <div class="stat"><b>${R.templates.length}</b><span>Templates</span></div>
    <div class="stat"><b>${R.scenarios.length}</b><span>Scenarios</span></div>
  </section>
  <h2 class="sec-title" id="calm" style="scroll-margin-top:16px">${esc(c.title)}</h2>
  <section class="calm"><p>${esc(c.intro)}</p><ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></section>
  ${SETTINGS.hubUrl ? `<p style="margin-top:36px;text-align:center"><a class="btn orange" href="${esc(SETTINGS.hubUrl)}" target="_blank" rel="noopener">← Back to Internship Hub</a></p>` : ''}
  </div>`;
}

function pageRoadmap() {
  return `<div class="page-in">
  <h1 class="page-title">First Job Roadmap</h1>
  <p class="lead">Four phases, from getting ready to saying goodbye. Take it one step at a time.</p>
  <div class="phases">
  ${R.roadmap.map((p, i) => `<section class="phase"><div class="badge ${shapes[i % 4]}" aria-hidden="true">${p.phase}</div>
    <div class="box ${boxColors[i % 4]}">
      <span class="mark">${esc(p.timing)}</span>
      <h2 style="margin-top:10px">Phase ${p.phase}: ${esc(p.title)}</h2>
      <p class="tag">${esc(p.tagline)}</p>
      <ul class="steps">${p.steps.map(s => `<li><b>${esc(s.title)}</b>${esc(s.text)}</li>`).join('')}</ul>
    </div></section>`).join('')}
  </div></div>`;
}

const S = { sheet: null, tv: {} };
function pageSafety() {
  if (!S.sheet) S.sheet = R.safety[0].id;
  return `<div class="page-in">
  <h1 class="page-title">Safety, Rights & Basics</h1>
  <p class="lead">Quick answers to the things students usually wonder about. Pick a topic.</p>
  <div class="chips" role="group" aria-label="Topics">${R.safety.map(s => `<button class="chip" type="button" data-sheet="${esc(s.id)}" aria-pressed="${S.sheet === s.id}">${esc(s.title)}</button>`).join('')}</div>
  <div id="sheet"></div>
  <h2 class="sec-title">Who can help?</h2>
  <div class="contacts">${R.trustedContacts.map(c => `<div class="contact"><b>${esc(c.who)}</b><span>${esc(c.when)}</span></div>`).join('')}</div>
  </div>`;
}
function paintSheet() {
  const s = R.safety.find(x => x.id === S.sheet) || R.safety[0];
  const red = s.id === 'safety-red-flags';
  $('#sheet').innerHTML = `<div class="box ${red ? 'orange' : 'sky'} sheet"><p class="intro">${esc(s.summary)}</p>
    ${s.items.map((it, i) => `<details ${i === 0 ? 'open' : ''}><summary>${esc(it.q)}</summary><div class="ans"><p>${esc(it.a)}</p>${it.list ? `<ul>${it.list.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}</div></details>`).join('')}</div>`;
}

function pageTemplates() {
  return `<div class="page-in">
  <h1 class="page-title">Message Templates</h1>
  <p class="lead">Short, polite messages you can use today. Replace everything in <mark style="background:var(--orange);color:var(--indigo);border-radius:6px;padding:0 4px;font-weight:700">[square brackets]</mark>, then copy and send.</p>
  <div class="dlbar"><button class="btn orange sm" type="button" data-dl="${reg(allTemplatesText())}" data-name="survival-hub-templates.txt">Download all templates (.txt)</button>
    <span class="hint">You can also use the Copy buttons and paste into Word or Google Docs.</span></div>
  <div class="tpl" id="tplwrap"></div></div>`;
}
function paintTemplates() {
  $('#tplwrap').innerHTML = R.templates.map((t, i) => {
    const vi = Math.min(S.tv[t.id] || 0, t.variants.length - 1), v = t.variants[vi];
    const ph = [...new Set((fullMsg(v).match(/\[[^\]]+\]/g) || []))];
    return `<article class="tpl-card">
      <div class="tpl-head"><div class="badge ${shapes[i % 4]}" aria-hidden="true">${esc(t.letter)}</div><div><h2>Template ${esc(t.letter)}: ${esc(t.title)}</h2><p>${esc(t.when)}</p></div></div>
      ${t.variants.length > 1 ? `<div class="chips dark" role="group" aria-label="Version" style="margin:0">${t.variants.map((x, j) => `<button class="chip" type="button" data-t="${esc(t.id)}" data-v="${j}" aria-pressed="${j === vi}">${esc(x.label)}</button>`).join('')}</div>` : ''}
      <div><div class="sub-label">Subject</div><div class="msg" style="margin-top:4px">${hl(v.subject)}</div></div>
      <div><div class="sub-label">Message</div><div class="msg" style="margin-top:4px">${hl(v.body)}</div></div>
      <div class="sub-label">Fill in: ${ph.map(esc).join(' · ')}</div>
      <div class="actions">
        <button class="btn orange sm" type="button" data-copy="${reg(v.subject)}">Copy subject</button>
        <button class="btn orange sm" type="button" data-copy="${reg(v.body)}">Copy message</button>
        <button class="btn sm" style="background:var(--indigo);color:#fff" type="button" data-copy="${reg(fullMsg(v))}">Copy all</button>
        <button class="btn sm" style="background:#eef0fb" type="button" data-dl="${reg(fullMsg(v))}" data-name="template-${esc(t.letter.toLowerCase())}-${slug(v.label)}.txt">Download .txt</button>
      </div>
      <div><div class="sub-label">Tips</div><ul class="tips" style="margin-top:4px">${t.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </article>`;
  }).join('');
}

function pageScenarios() {
  return `<div class="page-in">
  <h1 class="page-title">Real-World Scenarios</h1>
  <p class="lead">Situations almost every intern faces. Read the situation, think about what you would do, then tap to check.</p>
  <div class="sgrid">${R.scenarios.map((s, i) => `<article class="sc">
    <div class="front"><span class="mark" style="width:max-content">Scenario ${i + 1}</span><h2>${esc(s.question)}</h2><p class="sit">${esc(s.situation)}</p>
      <button class="btn orange sm rev" type="button" aria-expanded="false" aria-controls="sc-${i}" style="width:max-content">Show me what to do</button></div>
    <div class="back-side" id="sc-${i}" hidden>
      <div class="ans-box a"><b>What to do</b>${esc(s.recommended_action)}</div>
      ${s.try_saying ? `<div class="ans-box s"><b>Try saying</b>${esc(s.try_saying)}</div>` : ''}
      <div class="ans-box w"><b>Why it works</b>${esc(s.why_it_works)}</div>
    </div></article>`).join('')}</div></div>`;
}

function pageRecap() {
  const r = R.recap;
  return `<div class="page-in">
  <h1 class="page-title">Quick Recap</h1>
  <p class="lead">${esc(r.intro)}</p>
  <div class="dlbar"><button class="btn orange sm" type="button" data-dl="${reg(recapText())}" data-name="survival-hub-quick-recap.txt">Download recap card (.txt)</button>
    <button class="btn ghost sm" type="button" data-copy="${reg(recapText())}">Copy recap</button></div>

  <h2 class="sec-title" style="margin-top:28px">${r.goldenRules.length} golden rules</h2>
  <div class="rules">${r.goldenRules.map((g, i) => `<article class="rule"><div class="badge ${shapes[i % 4]}" aria-hidden="true">${i + 1}</div><div><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p></div></article>`).join('')}</div>

  <h2 class="sec-title">Tick it off</h2>
  <div class="checks">${r.phaseChecks.map((p, i) => `<section class="box ${boxColors[i % 4]}"><h3>Phase ${i + 1}: ${esc(p.phase)} <span class="count" aria-live="polite">0/${p.items.length}</span></h3>
    ${p.items.map(x => `<label class="chk-row"><input class="chk" type="checkbox"><span>${esc(x)}</span></label>`).join('')}</section>`).join('')}</div>

  <h2 class="sec-title">Quick fixes</h2>
  <div class="fixes">${r.quickFixes.map(q => `<div class="fix"><div><b>${esc(q.situation)}</b><span>${esc(q.fix)}</span></div><a class="btn orange sm" href="#${esc(q.route)}">${esc(q.button)} →</a></div>`).join('')}</div>

  <h2 class="sec-title">Not sure what to write in your log?</h2>
  <p class="lead" style="margin-top:0">${esc(r.logPromptsIntro)}</p>
  <div class="sheet">${r.logPrompts.map(p => `<details><summary>${esc(p.prompt)}</summary><div class="ans"><p><b>Start with:</b> ${esc(p.starter)}</p><p style="margin-top:6px"><b>Why it helps:</b> ${esc(p.why_it_helps)}</p></div></details>`).join('')}</div>
  </div>`;
}

/* ---------- router ---------- */
const ROUTES = { home: ['Home', pageHome], roadmap: ['Roadmap', pageRoadmap], safety: ['Safety', pageSafety], templates: ['Templates', pageTemplates], scenarios: ['Scenarios', pageScenarios], recap: ['Recap', pageRecap] };
const ALIAS = { logistics: ['safety', 'transport'], etiquette: ['safety', 'phone-social'], redflags: ['safety', 'safety-red-flags'], stress: ['home', 'calm'], reflect: ['recap', null] };
function route() {
  let h = (location.hash || '#home').slice(1), focus = null;
  if (ALIAS[h]) { [h, focus] = ALIAS[h]; if (h === 'safety') S.sheet = focus; }
  if (!ROUTES[h]) h = 'home';
  $('#app').innerHTML = ROUTES[h][1]();
  document.title = (h === 'home' ? 'Survival Hub' : ROUTES[h][0]) + ' · EST Survival Hub';
  $('.nav').innerHTML = Object.entries(ROUTES).map(([k, [t]]) => `<a href="#${k}" ${k === h ? 'aria-current="page"' : ''}>${t}</a>`).join('');
  if (h === 'safety') paintSheet();
  if (h === 'templates') paintTemplates();
  const f = focus === 'calm' ? document.getElementById('calm') : null;
  if (f) f.scrollIntoView(); else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

async function doDownload(name, text) {
  /* In claude.ai the page asks the viewer to confirm the save; elsewhere (e.g. GitHub Pages) it downloads directly. */
  try {
    const d = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (d) { await d.save({ filename: name, data: text }); return 'saved'; }
  } catch (err) { return err && err.code === 'declined' ? 'declined' : 'failed'; }
  try {
    const u = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1500);
    return 'saved';
  } catch (_) { return 'failed'; }
}
document.addEventListener('change', e => {
  if (!e.target.classList.contains('chk')) return;
  const box = e.target.closest('.box'), all = box.querySelectorAll('.chk');
  box.querySelector('.count').textContent = box.querySelectorAll('.chk:checked').length + '/' + all.length;
});
document.addEventListener('click', async e => {
  const sh = e.target.closest('[data-sheet]');
  if (sh) { S.sheet = sh.dataset.sheet; document.querySelectorAll('[data-sheet]').forEach(b => b.setAttribute('aria-pressed', b === sh)); paintSheet(); return; }
  const vt = e.target.closest('[data-t]');
  if (vt) { S.tv[vt.dataset.t] = +vt.dataset.v; const y = window.scrollY; paintTemplates(); window.scrollTo(0, y); return; }
  const rv = e.target.closest('.rev');
  if (rv) { const p = document.getElementById(rv.getAttribute('aria-controls')); const open = p.hidden; p.hidden = !open; rv.setAttribute('aria-expanded', open); rv.textContent = open ? 'Hide answer' : 'Show me what to do'; return; }
  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const l = dl.dataset.label || dl.textContent; dl.dataset.label = l;
    const r = await doDownload(dl.dataset.name, TXT[dl.dataset.dl]);
    dl.textContent = r === 'saved' ? 'Saved!' : r === 'declined' ? l : 'Download unavailable. Use Copy.';
    clearTimeout(dl._t); dl._t = setTimeout(() => dl.textContent = l, 2200); return;
  }
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const text = TXT[btn.dataset.copy]; let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (_) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (__) {} }
  const label = btn.dataset.label || btn.textContent; btn.dataset.label = label;
  btn.textContent = ok ? 'Copied!' : 'Select the text and press Ctrl+C';
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = label; }, 2200);
});
route();
/* GitHub version: if content.json sits next to this file, it replaces the built-in content below.
   Edit content.json to change the site. The built-in CONTENT is only a fallback. */
fetch('content.json', { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(txt => {
  if (!txt) return;
  let j; try { j = JSON.parse(txt); }
  catch (e) { try { j = JSON.parse(txt.replace(/,(\s*[\]}])/g, '$1')); console.warn('content.json has a trailing comma. Please remove it.'); } catch (e2) { console.warn('content.json is not valid JSON:', e2.message); return; } }
  if (j && j.roadmap && j.safety && j.templates && j.scenarios && j.recap) { Object.assign(CONTENT, j); route(); }
}).catch(() => {});
</script>
